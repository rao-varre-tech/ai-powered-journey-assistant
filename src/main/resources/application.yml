spring:
  application:
    name: journey-assistant
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/journey_assistant}
    username: ${DATABASE_USERNAME:journey}
    password: ${DATABASE_PASSWORD:${POSTGRES_PASSWORD}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8080}
ivr:
  provider: ${IVR_PROVIDER:fake}
  max-attempts: ${IVR_MAX_ATTEMPTS:3}
  signature-validation-enabled: ${IVR_SIGNATURE_VALIDATION_ENABLED:false}
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  from-number: ${TWILIO_FROM_NUMBER:}
  public-base-url: ${PUBLIC_BASE_URL:}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
