spring:
  application:
    name: journey-assistant
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/journey_assistant}
    username: ${DATABASE_USERNAME:journey}
    password: ${DATABASE_PASSWORD:${POSTGRES_PASSWORD}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
