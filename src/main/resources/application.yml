spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: journey-assistant
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:journey_assistant}}
    username: ${DATABASE_USERNAME:${POSTGRES_USER:journey}}
    password: ${DATABASE_PASSWORD:${POSTGRES_PASSWORD:}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8080}
ivr:
  provider: ${IVR_PROVIDER:fake}
  max-retries: ${IVR_MAX_RETRIES:3}
  signature-validation-enabled: ${IVR_SIGNATURE_VALIDATION_ENABLED:false}
notification:
  provider: ${NOTIFICATION_PROVIDER:fake}
  strategy: ${NOTIFICATION_STRATEGY:sms}
  fallback-timeout: ${WHATSAPP_FALLBACK_TIMEOUT:60s}
  ride-link: ${RIDE_LINK:}
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  from-number: ${TWILIO_FROM_NUMBER:}
  sms-from: ${TWILIO_SMS_FROM:}
  whatsapp-from: ${TWILIO_WHATSAPP_FROM:}
  whatsapp-content-sid: ${TWILIO_WHATSAPP_CONTENT_SID:}
  public-base-url: ${PUBLIC_BASE_URL:}
gcp:
  tasks:
    project-id: ${GCP_PROJECT_ID:}
    location: ${GCP_TASKS_LOCATION:}
    queue: ${GCP_TASKS_QUEUE:}
    invoker-service-account: ${GCP_TASKS_INVOKER_SERVICE_ACCOUNT:}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
